# ThermoProActive — stack completo (PostgreSQL + API Django + Frontend Next.js).
# Subir tudo:   docker compose up --build
# Acessos:      Frontend http://localhost:3100  |  API http://localhost:8100/api
#               Swagger  http://localhost:8100/api/docs/  |  Admin http://localhost:3100/admin/login
# Tudo open-source e portável a qualquer VPS Linux (Cláusula 12.4 — sem lock-in).
#
# Portas 3100/8100 (em vez das convencionais 3000/8000) porque esta máquina já
# tem outros projetos ocupando as portas-padrão — ajuste livremente se um dia
# colidir de novo, é só trocar aqui + os dois lugares marcados abaixo.

services:
  db:
    image: postgres:16-alpine
    container_name: thermoproactive_db
    environment:
      POSTGRES_DB: thermoproactive
      POSTGRES_USER: thermo
      POSTGRES_PASSWORD: thermo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermo -d thermoproactive"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: thermoproactive_backend
    environment:
      SECRET_KEY: docker-dev-secret-troque-em-producao
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://thermo:thermo@db:5432/thermoproactive
      # Porta do front (ajuste 1/2 se a porta mudar de novo).
      CORS_ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      CSRF_TRUSTED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      FRONTEND_URL: http://localhost:3100
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploads (logomarcas, assinaturas digitais, fotos de placa e as imagens
      # dos achados que entram nos laudos) vivem em MEDIA_ROOT=/app/media.
      # Sem este volume eles ficam na camada gravável do container e SOMEM a
      # cada `docker compose up --build`. Os composes de produção
      # (docker-compose.prod.yml / .http.yml) já faziam isso; só o de
      # desenvolvimento estava sem, e foi assim que a logomarca do prestador
      # se perdeu numa reconstrução.
      - media:/app/media
    ports:
      - "8100:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Embutido no bundle do navegador em build-time — porta do backend (2/2).
        NEXT_PUBLIC_API_URL: http://localhost:8100/api
    container_name: thermoproactive_frontend
    depends_on:
      - backend
    ports:
      - "3100:3000"

volumes:
  pgdata:
  media:
