# =============================================================================
# ThermoProActive — stack de TESTE em HTTP (sem domínio, acesso pelo IP).
# db + backend + frontend + nginx (porta 80). SEM certbot / SEM HTTPS.
#
# Subir:  docker compose --env-file .env.prod -f docker-compose.http.yml up -d --build
# Logs:   docker compose --env-file .env.prod -f docker-compose.http.yml logs -f
# Parar:  docker compose --env-file .env.prod -f docker-compose.http.yml down
#
# Para o teste, o .env.prod deve usar valores de IP (ver instruções):
#   NEXT_PUBLIC_API_URL=http://SEU.IP/api   |   ALLOWED_HOSTS=SEU.IP,backend
# Quando tiver domínio, migre para docker-compose.prod.yml (HTTPS).
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: thermoproactive_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: thermoproactive_backend
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    # Migração que falha DERRUBA o container com o erro visível no log, em vez de
    # ficar em loop e deixar o nginx respondendo 502 sem explicação.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: thermoproactive_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: thermoproactive_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/app.http.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro

volumes:
  pgdata:
  media:
