# =============================================================================
# ThermoProActive — stack de PRODUÇÃO (VPS Linux)
# db (PostgreSQL) + backend (Django/gunicorn) + agendador + frontend (Next.js)
# + Caddy (HTTPS automático, Let's Encrypt) + nginx (rotas, atrás do Caddy)
# + backup (diário, criptografado)
#
# Antes de subir: DOMAIN apontando para o IP desta VPS (o Caddy emite o certificado
# sozinho na primeira subida) e as portas 80/443 abertas.
#
# Subir:   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Logs:    docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f
# Parar:   docker compose --env-file .env.prod -f docker-compose.prod.yml down
# Guia completo (deploy, backup, restauração, runbook): docs/19-OPERACAO-DEPLOY-BACKUP.md
#
# Tudo open-source e portável (Cláusula 12.4 — sem lock-in de fornecedor).
# =============================================================================

# Rotação dos logs dos containers (sem isto o json-file cresce sem limite e
# acaba enchendo o disco da VPS): 5 arquivos de 10 MB por serviço.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    container_name: thermoproactive_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Sem 'ports': o banco NÃO é exposto à internet, só à rede interna do compose.

  backend:
    build: ./backend
    container_name: thermoproactive_backend
    restart: unless-stopped
    init: true                      # reaper de processos (o Chromium do PDF gera filhos)
    logging: *default-logging
    env_file: .env.prod
    environment:
      LAUDOS_FRONTEND_URL: http://frontend:3000
      DEBUG: ${DEBUG:-False}        # seguro por padrão: sem DEBUG no .env.prod => False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media          # evidências/uploads persistem fora do container
    # Produção: migra, coleta estáticos e sobe o gunicorn. NÃO roda seed_demo
    # (evita recriar o admin de demonstração 'thermo123' a cada boot).
    # Migração que falha DERRUBA o container com o erro visível no log, em vez de
    # ficar em loop e deixar o nginx respondendo 502 sem explicação.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    # "Saudável" = o gunicorn aceita conexão e responde HTTP (qualquer status < 500;
    # um 400 de ALLOWED_HOSTS também prova que o app está de pé). start_period
    # cobre migrate + collectstatic no boot.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/api/auth/me/'); sys.exit(0 if c.getresponse().status < 500 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    expose:
      - "8000"                    # visível só para o nginx, não para a internet

  # Tarefas periódicas de notificação (Anexo I 2.10): fila de entregas com
  # retentativa (a cada 60 s) e alerta de SLA (a cada 60 min). Idempotente:
  # reiniciar ou rodar duas instâncias não duplica aviso. Usa a mesma imagem e o
  # mesmo .env do backend; se o banco ainda estiver migrando, o ciclo registra o
  # erro no log e tenta no próximo.
  agendador:
    build: ./backend
    container_name: thermoproactive_agendador
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file: .env.prod
    environment:
      DEBUG: ${DEBUG:-False}
    depends_on:
      backend:
        condition: service_started
    command: python manage.py agendador

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: thermoproactive_frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "3000"                    # visível só para o nginx

  # Rotas, mídia protegida (X-Accel), limite de login e cabeçalhos. Atrás do Caddy:
  # não publica porta (só o Caddy o alcança pela rede interna).
  nginx:
    image: nginx:1.27-alpine
    container_name: thermoproactive_nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
      - frontend
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN   # substitui só ${DOMAIN}, preserva $host etc.
    expose:
      - "80"
    volumes:
      - ./deploy/nginx:/etc/nginx/templates:ro   # app.conf.template -> conf.d/app.conf
      - media:/var/www/media:ro                  # entrega a mídia liberada pelo Django
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && kill -0 $$(cat /var/run/nginx.pid)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTPS: emite e renova o certificado do Let's Encrypt sozinho, redireciona HTTP,
  # www e o acesso pelo IP para https://DOMAIN e repassa tudo ao nginx.
  # Configuração: deploy/caddy/Caddyfile.
  caddy:
    # Tag fixa: um deploy não muda de versão sem ninguém ver.
    image: caddy:2.10-alpine
    container_name: thermoproactive_caddy
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}   # conta no Let's Encrypt (o nome vem da stack antiga)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                 # HTTP/3
    volumes:
      # A pasta inteira (não o arquivo): o git pull chega ao container sem recriá-lo.
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data              # certificados e conta ACME — não apague
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Backup diário criptografado (banco + mídia). Roda agendar.sh -> backup.sh às
  # BACKUP_AT; guarda em BACKUP_HOST_DIR (no HOST, fora dos volumes Docker, de
  # modo que 'docker compose down -v' não leva os backups junto) e, se
  # BACKUP_RCLONE_REMOTE estiver definido, envia a um destino externo qualquer
  # (rclone). A mídia é montada SOMENTE LEITURA. Frase-secreta e rclone.conf
  # ficam em BACKUP_CONFIG_DIR (fora do repositório). Detalhes: docs/19.
  backup:
    build: ./deploy/backup
    container_name: thermoproactive_backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_REMOTE_RETENTION_DAYS: ${BACKUP_REMOTE_RETENTION_DAYS:-400}
      BACKUP_ALERT_WEBHOOK: ${BACKUP_ALERT_WEBHOOK:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
    volumes:
      - media:/data/media:ro
      - ${BACKUP_HOST_DIR:-/var/backups/thermoproactive}:/backups
      - ${BACKUP_CONFIG_DIR:-/root/.thermoproactive}:/config:ro
    healthcheck:
      test: ["CMD", "/backup/healthcheck.sh"]
      interval: 15m
      timeout: 10s
      retries: 1
      start_period: 1m

  # Restauração sob demanda (NÃO sobe com 'up'; só com --profile restore).
  # Exemplo e salvaguardas: docs/19, seção "Restauração".
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile restore \
  #     run --rm backup-restore --set latest --db-host db --db-name ... --media-dir ...
  backup-restore:
    profiles: ["restore"]
    build: ./deploy/backup
    entrypoint: ["/backup/restore.sh"]
    logging: *default-logging
    environment:
      PGUSER: ${POSTGRES_USER}
      RESTORE_PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTORE_PRODUCTION_DB: db/${POSTGRES_DB}
      RESTORE_PRODUCTION_MEDIA: /restore/media-producao
    volumes:
      - media:/restore/media-producao
      - ${BACKUP_HOST_DIR:-/var/backups/thermoproactive}:/backups:ro
      - ${BACKUP_CONFIG_DIR:-/root/.thermoproactive}:/config:ro

volumes:
  pgdata:
  media:
  caddy-data:
  caddy-config:
