# ThermoProActive — Nginx SOMENTE HTTP (teste pelo IP, sem domínio/TLS).
# Use apenas com docker-compose.http.yml. Quando tiver domínio, migre para o
# app.conf.template (HTTPS) via docker-compose.prod.yml.
# Montado direto em /etc/nginx/conf.d/default.conf (não passa por envsubst).

server {
    listen 80 default_server;
    server_name _;                 # responde em qualquer nome/IP

    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/    { proxy_pass http://backend:8000; }
    location /admin/  { proxy_pass http://backend:8000; }
    location /static/ { proxy_pass http://backend:8000; }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
