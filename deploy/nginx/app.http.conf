# ThermoProActive — Nginx SOMENTE HTTP (teste pelo IP, sem domínio/TLS).
# Use apenas com docker-compose.http.yml. Quando tiver domínio, migre para o
# app.conf.template (HTTPS) via docker-compose.prod.yml.
# Montado direto em /etc/nginx/conf.d/default.conf (não passa por envsubst).

limit_req_zone $binary_remote_addr zone=tpa_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tpa_admin:10m rate=10r/m;

server_tokens off;

server {
    listen 80 default_server;
    server_name _;                 # responde em qualquer nome/IP

    # Upstreams resolvidos a cada requisição pelo DNS interno do Docker: com o
    # nome literal no proxy_pass o nginx guarda o IP do boot e responde 502
    # quando o backend/frontend é recriado num deploy (IP novo).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tpa_backend  http://backend:8000;
    set $tpa_frontend http://frontend:3000;

    client_max_body_size 25m;

    # Emiss?o Chromium mant?m o layout original e tem timeout interno de 90s.
    proxy_read_timeout 120s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Sobrescreve o X-Forwarded-For (cliente não forja IP). Django: NUM_PROXIES=1.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sem TLS não há HSTS; os demais cabeçalhos valem igual.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location ~ ^/api/auth/(portal|admin)/(login|esqueci-senha)/$ {
        limit_req zone=tpa_login burst=15 nodelay;
        limit_req_status 429;
        proxy_pass $tpa_backend;
    }
    location /api/    { proxy_pass $tpa_backend; }
    location /django-admin/ {
        limit_req zone=tpa_admin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $tpa_backend;
    }
    location /static/ { proxy_pass $tpa_backend; }

    # Mídia NÃO é pública (achado A-03): /api/media/ -> Django (login + escopo por
    # cliente) -> X-Accel-Redirect para esta location interna.
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass $tpa_frontend;
        proxy_http_version 1.1;
        # proxy_set_header aqui ANULA os herdados do server: repete Host/XFF,
        # senão o Next recebe Host "frontend:3000" e o X-Forwarded-For do cliente.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
